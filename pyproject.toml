[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuellib"
version = "3.0.1"
description = "FuelLib: A Python library for Group Contribution Method (GCM) calculations of fuel properties"
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "NLR", email = "david.montgomery@nlr.gov"},
]
requires-python = ">=3.12,<3.14"
keywords = ["fuel", "thermodynamics", "group-contribution", "properties"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.19.0",
    "pandas>=1.0.0",
    "scipy>=1.5.0",
    "pyyaml>=5.0",
    "matplotlib>=3.0",
    "rdkit>=2022.3.1",
    "importlib-resources>=5.0; python_version < '3.9'",
    "pydantic>=2.13.4",
    "pint>=0.24.4",
    "click>=8.4.2",
]

[project.optional-dependencies]
dev = [
    "black>=26.3.1",
    "pytest>=6.0",
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
    "sphinxcontrib-bibtex>=2.0",
    "codespell>=2.2.0",
    "ty>=0.0.74",
    "ruff>=0.16.4",
]

[project.scripts]
fl-export-converge = "fuellib.exporters.converge:main"
fl-export-pele = "fuellib.exporters.pele:main"
fl-build-docs = "fuellib.cli.build_docs:main"
fl-clean-docs = "fuellib.cli.clean_docs:main"
fl-format = "fuellib.cli.format_code:main"
fl-eps2K = "fuellib.cli.transport_props_converter:epsilon_to_kelvin_main"
fl-plt-comp = "fuellib.cli.plotting:comp_main"
fl-plt-props = "fuellib.cli.plotting:props_main"
fl-fuels = "fuellib.cli.fuel_manager:list_fuels_main"

[project.urls]
Repository = "https://github.com/NatLabRockies/FuelLib"
Issues = "https://github.com/NatLabRockies/FuelLib/issues"
Documentation = "https://NatLabRockies.github.io/FuelLib"

[tool.setuptools]
packages = ["fuellib", "fuellib.exporters", "fuellib.cli"]

[tool.setuptools.package-data]
fuellib = [
    "data/**/*.csv",
    "data/**/*.yaml",
]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311", "py312"]
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# Ruff configurations
[tool.ruff]
exclude = [
    "docs",
    "tutorials",
]

[tool.ruff.lint]
ignore = [
    "COM812",   # missing trailing comma (handled by format)
    "TID252",   # relative import
    "D203",     # confict: incorrect blank line before class (uses D211 instead)
    "D213",     # conflict: multi-line summary second line (uses D212 instead)
    "CPY001",   # copyright notice at top of file
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# Ty configurations
[tool.ty.src]
include = [
    "fuellib",
    "tests",
]

# Pixi configurations
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.9,<3.13"

[tool.pixi.pypi-dependencies]
fuellib = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.feature.dev.tasks]
fmt = "ruff format ."
lint = "ruff check . --fix"
types = "ty check"
test = "pytest"